# The pipeline of this project. GitHub runs it on a clean computer (a "runner")
# every time a commit or a tag is pushed.
#
#   test the data  ->  train  ->  test the model  ->  quality gate
#                  ->  keep the model  ->  release (tags only)
#                  ->  publish on Hugging Face and update the app (tags only)
#
# Any step that fails stops the pipeline: nothing after it runs.

name: ml-pipeline

on:
  push:

permissions:
  contents: write   # needed only by the last step, to create the release

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code of this commit
        uses: actions/checkout@v7

      - name: Install Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the libraries
        run: pip install -r requirements.txt

      - name: Test the data
        run: pytest -v tests/test_data.py

      - name: Train the model
        run: python train.py

      - name: Test the model
        run: pytest -v tests/test_model.py

      - name: Check the quality gate
        run: python check_quality.py

      - name: Keep the model of this run
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            model.joblib
            metrics.json

      - name: Publish a release (tags starting with v only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" model.joblib metrics.json
          --title "House price model $GITHUB_REF_NAME"
          --notes-file report.md

      - name: Publish the model on Hugging Face (tags starting with v only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub==2.4.0
          HF_USER=$(python -c "from huggingface_hub import whoami; print(whoami()['name'])")
          echo "Publishing as $HF_USER"
          echo "HF_USER=$HF_USER" >> "$GITHUB_ENV"
          hf upload "$HF_USER/house-price-model" model.joblib
          hf upload "$HF_USER/house-price-model" metrics.json
          hf repos tag create "$HF_USER/house-price-model" "$GITHUB_REF_NAME"

      - name: Update the app on Hugging Face (tags starting with v only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "$HF_USER/house-price-model" > space/model_repo.txt
          echo "$GITHUB_REF_NAME" > space/model_version.txt
          hf upload "$HF_USER/house-price-app" space . --repo-type space
